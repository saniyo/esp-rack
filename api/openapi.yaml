openapi: 3.1.0
info:
  title: ESPRackDemo device API
  version: 0.1.6-pre
  description: Generated by scripts/gen_openapi.py from the device's /api/v1/ui/manifest
    registry dump - do not edit by hand. Errors are RFC 9457 application/problem+json
    everywhere.
servers:
- url: http://{device_ip}
  variables:
    device_ip:
      default: 192.168.4.1
