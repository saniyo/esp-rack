  /api/v1/actions/cert.beginRecovery:
    post:
      summary: Trigger Recovery
      tags:
      - actions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Action accepted/executed
          content:
            application/json:
              schema:
                type: object
        '503':
          $ref: '#/components/responses/HeapPressure'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '202':
          description: Accepted - long-running action started
      description: Mutation - requires a write-capable role on top of the endpoint
        auth level (reader tokens receive 403). Arguments, when any, ride as query
        parameters.
