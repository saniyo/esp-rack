components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Human session JWT from /auth/token, or a long-lived machine token
        minted in System -> API Tokens (roles: reader = GET only, operator = read/write,
        admin).'
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details (application/problem+json). Clients branch
        on the stable `title` slug.
      properties:
        status:
          type: integer
        title:
          type: string
          description: machine-readable slug, e.g. heap_pressure
        detail:
          type: string
        retryAfter:
          type: integer
          description: seconds; present on transient 503s
      required:
      - status
      - title
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Valid identity, insufficient role (admin endpoint, or a mutation
        attempted with a reader token)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    HeapPressure:
      description: Transient heap pressure - retry after `retryAfter` seconds
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
