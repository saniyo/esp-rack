        '404':
          description: Unknown series id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - &id001
        name: series
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 100
      - name: cursor
        in: query
        schema:
          type: integer
          default: 0
        description: newest-first offset; use the previous page's nextCursor
