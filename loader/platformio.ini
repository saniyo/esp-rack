; esprack-loader: the OTA loader for the `loader` partition scheme
; (docs/plans/lib-ota-loader.md), one env per chip. The same code on every
; chip; the loader image doesn't depend on the flash size, so one build per
; chip serves the 4, 8 and 16 MB tables (partitions/loader_*MB.csv; the
; build checks it against the smallest factory partition, 4 MB's 768 KB).
;
;   pio run -d loader -e esp32c3          (PowerShell or cmd, not Git Bash)
;
; PlatformIO Core 6.2 and this platform disagree on tool-scons (4.11.1 vs
; 4.8.1) and an espidf build reinstalls it under itself ("No module named
; 'SCons.Tool.FortranCommon'"); build.ps1 builds the same with the IDF
; directly:  powershell -File loader/build.ps1 -Target esp32c3
;
; The signing key's public half is compiled in (main/ota_pubkey.h, from
; tools/ota_sign.py export-pubkey).
;
; The boot button (CMakeLists.txt, LOADER_BOOT_PIN; none by default), per
; env:  board_build.cmake_extra_args = -DLOADER_BOOT_PIN=9
; then delete sdkconfig.<env> (it keeps earlier choices). build.ps1:
; -BootPin 9. Flash mode / frequency per chip: sdkconfig.defaults.<target>.
;
; `-t upload` writes the loader alone into the `factory` partition
; (upload_factory.py): no bootloader, partition table, otadata or app. A
; first install: tools/flash_loader.ps1.

[platformio]
src_dir = main
default_envs = esp32c3

[env]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21-2
framework = espidf
board_build.partitions = ../partitions/loader_4MB.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
platform_packages = platformio/tool-cmake@^3.30.2
extra_scripts = post:upload_factory.py

[env:esp32]
board = esp32dev

[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio

[env:esp32c6]
board = esp32-c6-devkitc-1

[env:esp32s3]
board = esp32-s3-devkitc-1
