; Host unit tests for ESPRackPure (and future pure parts of modules).
; GCC hosts (Linux, MinGW, Docker):  pio test -e native
; Any C++17 compiler incl. MSVC:     see CMakeLists.txt next to this file.
[env:native]
platform = native
test_framework = unity
lib_extra_dirs = ../lib
lib_deps = ESPRackPure
build_flags = -std=gnu++17 -I../modules/digital-io/include
